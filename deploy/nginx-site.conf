# nginx config mounted into the standalone ndu-static container.
# Independent of the navoiyliklar compose stack and its Caddy; it only
# publishes its own port on the host.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # Static site: every page is a real file, so a miss is a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Stylesheet and script change with every design pass and carry no
    # fingerprint in the filename, so the browser must revalidate them each
    # time. (The deploy also stamps their URLs with ?v=<hash>; this is the belt.)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # The hero video is 9 MB: range requests let the browser start playback
    # before the whole file is down and seek without re-downloading.
    location ~* \.(mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    location ~* \.(woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
