# nginx config mounted into the standalone wiut-static container.
# Independent of the navoiyliklar compose stack and its Caddy; it only
# publishes its own port on the host.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # Static multi-page site: every page is a real file, so a miss is a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
