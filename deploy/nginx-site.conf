# nginx config mounted into the standalone ndu-static container.
# Independent of the navoiyliklar compose stack and its Caddy; it only
# publishes its own port on the host.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Behind the Caddy of the navoiyliklar stack (ndu.uz) requests arrive from
    # a Docker-internal address with the visitor's IP in X-Forwarded-For.
    # Trust that header from Docker networks only, so $remote_addr (the access
    # log, the view counter) is the real visitor. Direct hits on :8083 carry
    # no such header and are unaffected.
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;

    # Directory redirects (/admin -> /admin/) must stay relative: nginx itself
    # speaks plain http, while the public scheme is https via Caddy.
    absolute_redirect off;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # News admin backend (deploy/api/api.py): login, commits, instant publish.
    # Same origin as the admin page, so the session cookie just works and no
    # CORS is involved; the /api/ prefix is stripped.
    location /api/ {
        proxy_pass         http://api:8080/;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   Host $host;
        # A post carries its photos base64-encoded in one request, and the
        # commit to GitHub happens before the answer comes back.
        client_max_body_size 80m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # View counter (deploy/counter/counter.py). Same origin as the pages, so
    # no CORS or mixed-content issues; the /views/ prefix is stripped.
    location /views/ {
        proxy_pass         http://counter:8080/;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # Static multi-page site: every page is a real file, so a miss is a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Images and fonts are content-stable: cache them hard.
    location ~* \.(woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # CSS and JS change with every deploy. They carry a ?v=<hash> stamp
    # (scripts/stamp_assets.py), so a stale copy would otherwise stick around
    # in a visitor's browser for a month. Make the browser revalidate.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
