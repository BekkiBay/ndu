name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links and assets
        run: python3 scripts/check_links.py

      - name: Report size
        run: |
          du -sh .
          echo "html pages: $(ls *.html | wc -l)"

  deploy-hermes:
    name: Deploy to Hermes
    needs: check
    runs-on: ubuntu-latest
    # runs only when the Hermes secrets are configured
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Skip if server secrets are missing
        id: guard
        env:
          HOST: ${{ secrets.HERMES_HOST }}
          KEY: ${{ secrets.HERMES_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "HERMES_HOST / HERMES_SSH_KEY not set - skipping server deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.HERMES_SSH_KEY }}
          HOST: ${{ secrets.HERMES_HOST }}
          PORT: ${{ secrets.HERMES_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync site to server
        if: steps.guard.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HERMES_HOST }}
          PORT: ${{ secrets.HERMES_PORT || '22' }}
          USER: ${{ secrets.HERMES_USER || 'root' }}
          PATH_REMOTE: ${{ secrets.HERMES_PATH || '/var/www/navdu' }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'scripts' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$USER@$HOST:$PATH_REMOTE/"

      - name: Reload web server
        if: steps.guard.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HERMES_HOST }}
          PORT: ${{ secrets.HERMES_PORT || '22' }}
          USER: ${{ secrets.HERMES_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" 'nginx -t && systemctl reload nginx || true'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
